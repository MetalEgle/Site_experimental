<style>
    @view-transition {
        navigation: auto;
    }

    ::view-transition-old(root) {
        animation: page-exit .18s ease both;
    }

    ::view-transition-new(root) {
        animation: page-enter .32s cubic-bezier(.2, .75, .25, 1) both;
    }

    @keyframes page-exit {
        to { opacity: 0; transform: translateY(-4px); }
    }

    @keyframes page-enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .site-nav {
        position: fixed;
        z-index: 10;
        top: 24px;
        left: 50%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        width: calc(100% - 32px);
        transform: translateX(-50%);
        transition: transform .3s cubic-bezier(.2, .75, .25, 1), opacity .3s ease;
    }

    .site-nav.is-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, calc(-100% - 32px));
    }

    .site-nav a {
        padding: 11px 17px;
        border: 1px solid #ffffff36;
        border-radius: 12px;
        color: white;
        background: #ffffff12;
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
        backdrop-filter: blur(12px);
        transition: background .2s, border-color .2s, transform .2s, box-shadow .2s;
    }

    .site-nav a:hover {
        border-color: #ff8a5b;
        background: #ff6b35;
        transform: translateY(-2px);
        box-shadow: 0 8px 22px #ff6b3540;
    }

    .site-nav a:focus-visible {
        outline: 3px solid #ffd1c0;
        outline-offset: 3px;
    }

    @media (max-width: 520px) {
        .site-nav {
            top: max(12px, env(safe-area-inset-top));
            gap: 6px;
            width: calc(100% - 24px);
        }

        .site-nav a {
            padding: 9px 11px;
            font-size: clamp(11px, 3vw, 12px);
        }
    }

    @media (max-width: 360px) {
        .site-nav {
            gap: 5px;
        }

        .site-nav a {
            padding: 8px 9px;
            font-size: 11px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation-duration: .01ms;
        }

        .site-nav {
            transition-duration: .01ms;
        }
    }
</style>

<nav class="site-nav" aria-label="Основная навигация">
    <a href="{% url 'home' %}">Главная</a>
    <a href="{% url 'about' %}">Каталог</a>
    <a href="{% url 'add_product' %}">Добавить авто</a>
    <a href="{% url 'login' %}">Регистрация</a>
</nav>

<script>
    const siteNavigation = document.querySelector(".site-nav");
    const navigationCollisionTarget = document.querySelector(".search, .card");

    function updateNavigationVisibility() {
        const isAtPageTop = window.scrollY < 40;
        const targetReachedNavigation = navigationCollisionTarget
            && navigationCollisionTarget.getBoundingClientRect().top
                <= siteNavigation.getBoundingClientRect().bottom + 12;

        if (isAtPageTop || !targetReachedNavigation) {
            siteNavigation.classList.remove("is-hidden");
        } else if (!siteNavigation.contains(document.activeElement)) {
            siteNavigation.classList.add("is-hidden");
        }
    }

    window.addEventListener("scroll", updateNavigationVisibility, { passive: true });
    window.addEventListener("resize", updateNavigationVisibility);
    updateNavigationVisibility();

    siteNavigation.addEventListener("focusin", () => {
        siteNavigation.classList.remove("is-hidden");
    });
</script>
