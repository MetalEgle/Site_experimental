<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: #fff; font-family: Arial, sans-serif; background: radial-gradient(circle at 80% 15%, #ff8a5b 0, transparent 28%), linear-gradient(135deg, #172033 0%, #273b63 100%); }
        .hero { min-height: 100vh; display: grid; place-items: center; padding: 30px; text-align: center; }
        .content { max-width: 720px; }
        .badge { display: inline-block; padding: 8px 13px; margin-bottom: 22px; border: 1px solid #ffffff36; border-radius: 99px; color: #ffd1c0; background: #ffffff12; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(52px, 12vw, 120px); line-height: .9; letter-spacing: -7px; }
        p { margin: 26px 0 0; color: #c6d0e2; font-size: clamp(17px, 3vw, 22px); line-height: 1.5; }
        .line { width: 64px; height: 4px; margin: 34px auto 0; border-radius: 10px; background: #ff6b35; }
    </style>
</head>
<body>
    <main class="hero">
        <div class="content">
            <span class="badge">Добро пожаловать</span>
            <h1>Привет!</h1>
            <p>Это мой первый Django сайт</p>
            <div class="line"></div>
        </div>
    </main>
</body>
</html>
