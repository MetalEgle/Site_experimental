<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой сайт</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; overflow: hidden; color: #fff; font-family: Arial, sans-serif; }
        .hero { min-height: 100vh; display: grid; place-items: center; padding: 100px 30px 30px; text-align: center; }
        .content { max-width: 720px; animation: content-arrive .9s cubic-bezier(.2, .75, .25, 1) both; }
        @keyframes content-arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        .badge { display: inline-block; padding: 8px 13px; margin-bottom: 22px; border: 1px solid #ffffff36; border-radius: 99px; color: #ffd1c0; background: #ffffff12; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 0; font-size: clamp(52px, 12vw, 120px); line-height: .9; letter-spacing: -7px; }
        p { margin: 26px 0 0; color: #c6d0e2; font-size: clamp(17px, 3vw, 22px); line-height: 1.5; }
        .line { width: 64px; height: 4px; margin: 34px auto 0; border-radius: 10px; background: #ff6b35; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    {% include "includes/ambient-background.html" %}
    {% include "includes/navigation.html" %}
    <main class="hero">
        <div class="content">
            <span class="badge">Добро пожаловать</span>
            <h1>Привет!</h1>
            <p>Это мой первый Django сайт</p>
            <div class="line"></div>
        </div>
    </main>
</body>
</html>
