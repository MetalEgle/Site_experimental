<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить автомобиль</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #172033; font-family: Arial, sans-serif; background: linear-gradient(135deg, #fff4ee, #f2f5fb); }
        .card { width: min(100%, 520px); padding: clamp(26px, 6vw, 48px); background: #fff; border: 1px solid #e7ebf2; border-radius: 24px; box-shadow: 0 24px 60px #20304d18; }
        .eyebrow { margin: 0 0 10px; color: #ff6b35; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 0 0 30px; font-size: clamp(28px, 5vw, 40px); letter-spacing: -1px; }
        form p { display: flex; flex-direction: column; gap: 8px; margin: 0 0 18px; color: #536078; font-size: 14px; font-weight: 700; }
        input { width: 100%; padding: 13px 14px; color: #172033; font: inherit; border: 1px solid #dfe5ee; border-radius: 10px; outline: none; }
        input:focus { border-color: #ff6b35; box-shadow: 0 0 0 4px #ff6b351c; }
        button { width: 100%; margin-top: 8px; padding: 14px; border: 0; border-radius: 10px; color: white; background: #172033; font: inherit; font-weight: 700; cursor: pointer; transition: background .2s, transform .2s; }
        button:hover { background: #ff6b35; transform: translateY(-2px); }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">Новая запись</p>
        <h1>Введите авто</h1>
        <form method="POST">
            {% csrf_token %}
            {{form.as_p}}
            <button type="submit">Отправить</button>
        </form>
    </main>
</body>
</html>
